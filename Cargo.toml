# [package]
# name = "tantivy_multitenancy_test"
# version = "0.1.0"
# edition = "2021"

[package]
name = "flapjack_rust"
version = "0.1.0"
edition = "2021"

# Main binary (your existing main.rs)
[[bin]]
name = "flapjack_rust"
path = "src/main.rs"

# LMDB test binary
[[bin]]
name = "lmdb_test"
path = "src/bin/lmdb_test.rs"

[[bin]]
name = "fst_overhead_test"
path = "src/bin/fst_overhead_test.rs"

[[bin]]
name = "fst_overhead_test_2"
path = "src/bin/fst_overhead_test_2.rs"

[[bin]]
name = "write_latency_test"
path = "src/bin/write_latency_test.rs"

[[bin]]
name = "mmap_demand_test"
path = "src/bin/mmap_demand_test.rs"

[[bin]]
name = "selective_fault_test"
path = "src/bin/selective_fault_test.rs"

[[bin]]
name = "write_batch_scaling_test"
path = "src/bin/write_batch_scaling_test.rs"

[[bin]]
name = "sort_test"
path = "src/bin/sort_test.rs"

[[bin]]
name = "fst_overhead_test_clean"
path = "src/bin/fst_overhead_test_clean.rs"

# Add these three entries to your [[bin]] sections in Cargo.toml:

[[bin]]
name = "separate_env_memory_test"
path = "src/bin/nov4_8pm/separate_env_memory_test.rs"

[[bin]]
name = "sequential_commit_test"
path = "src/bin/nov4_8pm/sequential_commit_test.rs"

[[bin]]
name = "migration_copy_test"
path = "src/bin/nov4_8pm/migration_copy_test.rs"
[[bin]]
name = "concurrent_read_test"
path = "src/bin/nov4_810pm/concurrent_read_test.rs"

[[bin]]
name = "realistic_size_test"
path = "src/bin/nov4_810pm/realistic_size_test.rs"

[[bin]]
name = "bm25_memory_test"
path = "src/bin/nov4_10pm/bm25_memory_test.rs"

[[bin]]
name = "bm25_correctness_test"
path = "src/bin/nov4_10pm/bm25_correctness_test.rs"

[[bin]]
name = "bm25_query_perf_test"
path = "src/bin/nov4_10pm/bm25_query_perf_test.rs"

[dependencies]
tantivy = "0.22"
serde_json = "1.0"
rand = "0.8"
lmdb = "0.8"
fst = "0.4"
heed = "0.20"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.5"
tempfile = "3.8"
# Add to Cargo.toml [dependencies]
# mach2 = "0.4"

[profile.release]
opt-level = 3
lto = true


